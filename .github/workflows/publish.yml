# Publishes to pub.dev when a tag like v0.1.0 is pushed. Uses pub.dev's
# automated publishing (GitHub OIDC), so no token is stored anywhere.
# One-time setup on pub.dev: package Admin -> Automated publishing ->
# GitHub Actions, repository oxisoft/android_attestation, tag pattern v{{version}}.
name: publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter pub publish --force
